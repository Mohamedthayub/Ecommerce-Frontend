
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navbar</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <header class="flex items-center justify-between bg-red-400 p-4 m-4 rounded-lg">

        <!-- Logo -->
        <h1 class="text-2xl sm:text-3xl font-bold">
            Navbar
        </h1>

        <!-- Desktop Navigation -->
        <nav class="hidden sm:block">
            <ul class="flex items-center gap-6">
                <li>
                    <a href="#" class="font-bold text-lg hover:text-white">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#" class="font-bold text-lg hover:text-white">
                        Products
                    </a>
                </li>

                <li>
                    <a href="#" class="font-bold text-lg hover:text-white">
                        About
                    </a>
                </li>

                <li>
                    <a href="#" class="font-bold text-lg hover:text-white">
                        Cart
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Mobile Menu Button -->
        <button
            type="button"
            class="sm:hidden bg-black text-white px-3 py-2 rounded-lg font-bold"
        >
            ☰
        </button>

    </header>

</body>
</html>
