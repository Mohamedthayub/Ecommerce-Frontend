<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="bg-red-400 sm:flex flex justify-between sm:justify-around h-15 sm:p-4 sm:rounded-lg sm:m-4 p-3 m-4 rounded-md">
        <h1 class="sm:text-3xl sm:font-bold text-3xl font-bold">Navbar</h1>
        <ul class="sm:flex  flex justify-center items-center flex-col sm:mt-0 sm:flex-row  m-2 w-full mt-30 bg-red-400">
            <p class="sm:font-bold pointer sm:text-lg font-bold">Home</p>
            <p class="sm:font-bold sm:ml-4 pointer sm:text-lg font-bold">Products</p>
            <p class="sm:font-bold sm:ml-4 pointer sm:text-lg font-bold">About</p>
            <p class="sm:font-bold sm:ml-4 pointer sm:text-lg font-bold">Cart</p>
        </ul>
        <button type="button" class="sm:hidden  bg-black text-white h-8 px-2 mt-1 rounded-lg font-bold">Humberger</button>
    </header>
</body>
</html>
